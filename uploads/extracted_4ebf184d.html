<body>
  <div id="__bundler_placeholder">Loading Storm Agency — менеджмент для Fansly-криейторов...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

XCjzlV0aSkS_o8OacszicvHPHpYxRTw.woff2) format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Tektur';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/tektur/v6/XoH62YHtS7q969kXCjzlV0aSkS_o8OacszScvHPHpYxRTw.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Tektur';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/tektur/v6/XoH62YHtS7q969kXCjzlV0aSkS_o8OacszWcvHPHpYxRTw.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Tektur';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"432766ce-bc2c-46e0-9113-7b5d6c987e2b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#0B0D10}\na{color:#C9D4E3}a:hover{color:#FFFFFF}\ninput::placeholder{color:#5F6672}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 100%; background: #0B0D10; color: #F1F3F5; font-family: 'Golos Text', sans-serif; font-size: 17px; line-height: 1.6\">\n\n  <!-- NAV -->\n  <header style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F1F3F5\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" aria-hidden=\"true\">\n          <path d=\"M6 10 H26\" stroke=\"{{accent}}\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M11 16 H26\" stroke=\"{{accent}}\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M6 22 H21\" stroke=\"{{accent}}\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.06em\">STORM<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display: flex; flex-wrap: wrap; gap: 26px; align-items: center; font-size: 15px\">\n        <a href=\"#services\" style=\"text-decoration: none; color: #9AA1AC\">Что делаем<\u002Fa>\n        <a href=\"#cases\" style=\"text-decoration: none; color: #9AA1AC\">Кейсы<\u002Fa>\n        <a href=\"#process\" style=\"text-decoration: none; color: #9AA1AC\">Процесс<\u002Fa>\n        <a href=\"#faq\" style=\"text-decoration: none; color: #9AA1AC\">FAQ<\u002Fa>\n        <a href=\"#apply\" style=\"text-decoration: none; background: {{accent}}; color: #0B0D10; font-weight: 700; padding: 11px 22px; border-radius: 999px\">Оставить заявку<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" style=\"border-bottom: 1px solid #1D2026; position: relative; overflow: hidden\">\n    <svg width=\"560\" height=\"560\" sc-camel-view-box=\"0 0 560 560\" fill=\"none\" aria-hidden=\"true\" style=\"position: absolute; right: -140px; top: -120px\">\n      <circle cx=\"280\" cy=\"280\" r=\"248\" stroke=\"#1D2026\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"280\" cy=\"280\" r=\"180\" stroke=\"#1D2026\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"280\" cy=\"280\" r=\"112\" stroke=\"#262A32\" stroke-width=\"1.5\"><\u002Fcircle>\n      <path d=\"M120 280 H440\" stroke=\"#262A32\" stroke-width=\"1.5\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 100px 24px 72px 24px; display: flex; flex-direction: column; gap: 28px; position: relative\">\n      <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.2em; color: {{accent}}\">STORM AGENCY · FANSLY MANAGEMENT<\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 62px; line-height: 1.08; max-width: 900px\">Контент — твой.<br>Система — наша.<\u002Fh1>\n      <p style=\"margin: 0; max-width: 620px; font-size: 20px; color: #B7BEC9\">Выстраиваем вокруг твоей страницы на Fansly рабочую машину: трафик, продажи в чатах, цены и защиту. Ты снимаешь 1–2 дня в неделю — остальное делает команда.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px\">\n        <a href=\"#apply\" style=\"text-decoration: none; background: {{accent}}; color: #0B0D10; font-weight: 700; font-size: 17px; padding: 17px 34px; border-radius: 999px\">Начать зарабатывать<\u002Fa>\n        <a href=\"#audit\" style=\"text-decoration: none; border: 1px solid #2E333C; color: #F1F3F5; font-weight: 600; font-size: 17px; padding: 17px 34px; border-radius: 999px\">Бесплатный разбор страницы<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 0; margin-top: 40px; border: 1px solid #1D2026; border-radius: 14px; background: #101318\">\n        <div style=\"flex: 1 1 200px; padding: 24px 28px; border-right: 1px solid #1D2026; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 28px; color: {{accent}}\">[N]+<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #9AA1AC\">моделей в работе<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 200px; padding: 24px 28px; border-right: 1px solid #1D2026; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 28px; color: {{accent}}\">$[X]k+<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #9AA1AC\">выплачено моделям<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 200px; padding: 24px 28px; border-right: 1px solid #1D2026; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 28px; color: {{accent}}\">24/7<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #9AA1AC\">чаты без выходных<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 200px; padding: 24px 28px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 28px; color: {{accent}}\">24ч<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #9AA1AC\">ответ на заявку<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- МАНИФЕСТ -->\n  <section style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n      <div style=\"flex: 1 1 420px\">\n        <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.2\">Красивая страница без системы не зарабатывает.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 420px; color: #B7BEC9; font-size: 18px; display: flex; flex-direction: column; gap: 14px\">\n        <p style=\"margin: 0\">90% криейторов застревают на одном уровне не из-за контента — из-за того, что некому приводить фанатов и некому им продавать.<\u002Fp>\n        <p style=\"margin: 0\">Storm закрывает ровно это: ежедневный трафик, продажи в переписках и цены, которые растут вместе со спросом. Контент — твой. Система — наша.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- УСЛУГИ -->\n  <section id=\"services\" style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end\">\n        <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px\">Что мы делаем<\u002Fh2>\n        <a href=\"#apply\" style=\"text-decoration: none; color: {{accent}}; font-weight: 600\">Оставить заявку →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">01 / ТРАФИК<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Новые фанаты каждый день<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Reddit, X/Twitter и взаимопиар — выстроенный конвейер, который стабильно приводит подписчиков на твою страницу.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">02 / ПРОДАЖИ<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Чаты, которые продают<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Обученная команда ведёт переписки на английском 24/7 от твоего имени, по твоим правилам и границам. Ты не пишешь ни одного сообщения.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">03 / КОНТЕНТ<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Стратегия и сценарии<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Персона, ниша, шот-листы и план съёмок. Ты никогда не сидишь с вопросом «что снимать» — он всегда решён заранее.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">04 / ДЕНЬГИ<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Цены и аналитика<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Тестируем цены, форматы и рассылки, растим средний чек. Каждую неделю ты видишь отчёт: что продалось, что растёт, что дальше.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">05 / ЗАЩИТА<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Анонимность и DMCA<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Geo-блокировка твоей страны, вотермарки, мониторинг сливов и удаление украденного контента. Твои границы фиксируются письменно.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-size: 13px; color: {{accent}}; letter-spacing: 0.1em\">06 / ПОДДЕРЖКА<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 19px\">Личный менеджер<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Один человек на связи с тобой каждый день: план недели, обратная связь, ответы на любые вопросы на русском или украинском.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- КЕЙСЫ -->\n  <section id=\"cases\" style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n      <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px\">Кейсы<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 24px; color: {{accent}}\">$[X] → $[Y]<\u002Fdiv>\n          <div style=\"font-weight: 600\">Модель [A] · ниша [укажи]<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">[Короткая история: с чем пришла, что сделали, результат за N месяцев]<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 24px; color: {{accent}}\">$[X] → $[Y]<\u002Fdiv>\n          <div style=\"font-weight: 600\">Модель [B] · ниша [укажи]<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">[Короткая история: с чем пришла, что сделали, результат за N месяцев]<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 30px; background: #101318; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 24px; color: {{accent}}\">0 → $[Y]<\u002Fdiv>\n          <div style=\"font-weight: 600\">Модель [C] · старт с нуля<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">[Короткая история: без опыта и аудитории, запуск с нуля, результат за N месяцев]<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 14px; color: #5F6672\">Блок появится на сайте, когда будут первые реальные результаты — выдуманные цифры убивают доверие быстрее, чем их отсутствие.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- БЕСПЛАТНЫЙ РАЗБОР (CTA BAND) -->\n  <section id=\"audit\" style=\"border-bottom: 1px solid #1D2026; background: #101318\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: space-between\">\n      <div style=\"flex: 1 1 520px; display: flex; flex-direction: column; gap: 14px\">\n        <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 34px\">Уже ведёшь страницу сама?<\u002Fh2>\n        <p style=\"margin: 0; color: #B7BEC9; font-size: 18px; max-width: 560px\">Пришли ссылку — за 48 часов разберём твою страницу и честно скажем, где ты теряешь деньги: трафик, цены, чаты. Бесплатно и без обязательств, разбор остаётся тебе в любом случае.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"#apply\" style=\"text-decoration: none; background: {{accent}}; color: #0B0D10; font-weight: 700; font-size: 18px; padding: 18px 36px; border-radius: 999px; flex-shrink: 0\">Получить разбор бесплатно<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ПРОЦЕСС -->\n  <section id=\"process\" style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n      <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px\">От заявки до первых выплат<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n        <div style=\"flex: 1 1 250px; padding: 28px; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 15px; color: {{accent}}\">ШАГ 1 · ДЕНЬ 1<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Заявка и созвон<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Анкета на 2 минуты, ответ в течение 24 часов, созвон на 15–20 минут. Все условия и процент — сразу, без «обсудим потом».<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 250px; padding: 28px; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 15px; color: {{accent}}\">ШАГ 2 · НЕДЕЛЯ 1<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Договор и образ<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Верификация 18+, договор, твои границы письменно. Собираем персону, нишу и план первых съёмок.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 250px; padding: 28px; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 15px; color: {{accent}}\">ШАГ 3 · НЕДЕЛИ 2–3<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Контент и запуск<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Первые съёмки по шот-листам, оформление страницы, включаем трафик и чаты.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 250px; padding: 28px; border: 1px solid #1D2026; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 15px; color: {{accent}}\">ШАГ 4 · С МЕСЯЦА 1<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Рост и выплаты<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 15px\">Первые продажи обычно в первый месяц, стабильный доход — со 2–3 месяца. Еженедельные отчёты, выплаты от Fansly напрямую тебе.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- КОГО ИЩЕМ -->\n  <section style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-wrap: wrap; gap: 48px\">\n      <div style=\"flex: 1 1 400px; display: flex; flex-direction: column; gap: 14px\">\n        <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px\">Мы не берём всех<\u002Fh2>\n        <p style=\"margin: 0; color: #B7BEC9; font-size: 18px\">Команда вкладывает в каждую модель десятки часов в месяц, поэтому выбираем тех, с кем этот вклад сработает. Опыт не нужен. Нужна готовность работать.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 480px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; gap: 14px; padding: 18px 22px; background: #101318; border: 1px solid #1D2026; border-radius: 12px\"><span style=\"color: {{accent}}; font-weight: 700\">✓<\u002Fspan><span>Тебе есть 18 лет — проверяем документы без исключений<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 18px 22px; background: #101318; border: 1px solid #1D2026; border-radius: 12px\"><span style=\"color: {{accent}}; font-weight: 700\">✓<\u002Fspan><span>Готова снимать 1–2 дня в неделю, стабильно, а не «по настроению»<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 18px 22px; background: #101318; border: 1px solid #1D2026; border-radius: 12px\"><span style=\"color: {{accent}}; font-weight: 700\">✓<\u002Fspan><span>Адекватные ожидания: доход строится 2–3 месяца, а не за неделю<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 18px 22px; background: #101318; border: 1px solid #1D2026; border-radius: 12px\"><span style=\"color: {{accent}}; font-weight: 700\">✓<\u002Fspan><span>Решения принимаешь ты сама — мы не работаем через «посредников»<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 36px\">\n      <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 700; font-size: 36px\">Вопросы, которые задают все<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 880px\">\n        <div style=\"padding: 24px 28px; background: #101318; border: 1px solid #1D2026; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Без опыта возьмёте?<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 16px\">Да — большинство наших моделей начинали с нуля. Персону, стратегию и первый контент собираем вместе на онбординге.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #101318; border: 1px solid #1D2026; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Можно без лица?<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 16px\">Можно. С лицом рост быстрее — это честный факт, но анонимный формат мы тоже продвигаем, плюс geo-блок закрывает твою страну от знакомых.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #101318; border: 1px solid #1D2026; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Какой процент?<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 16px\">Фиксируется в договоре до старта и зависит от формата. Называем цифру на первом созвоне — до того, как ты что-либо подпишешь.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #101318; border: 1px solid #1D2026; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Аккаунт будет на вас?<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 16px\">Нет. Аккаунт твой, выплаты от Fansly приходят напрямую тебе. Уходишь — страница и аудитория остаются с тобой.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #101318; border: 1px solid #1D2026; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Сколько я буду зарабатывать?<\u002Fdiv>\n          <div style=\"color: #9AA1AC; font-size: 16px\">Любой, кто называет тебе точную цифру до старта, врёт. Диапазон зависит от ниши, регулярности и месяца работы — реалистичную вилку под твой случай даём после созвона и разбора.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ФИНАЛЬНЫЙ CTA + ФОРМА -->\n  <section id=\"apply\" style=\"border-bottom: 1px solid #1D2026\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px 96px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n      <div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 18px\">\n        <h2 style=\"margin: 0; font-family: 'Tektur', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.12\">Шторм начинается<br>с одной заявки<\u002Fh2>\n        <p style=\"margin: 0; color: #B7BEC9; font-size: 18px; max-width: 480px\">2 минуты. Без документов и фото. Ответим в Telegram в течение 24 часов — даже если ответ будет «мы не подходим друг другу».<\u002Fp>\n        <p style=\"margin: 0; color: #5F6672; font-size: 15px\">Быстрее напрямую: <a href=\"https://t.me/ВАШ_TELEGRAM\">@ВАШ_TELEGRAM<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <form style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 16px; background: #101318; border: 1px solid #1D2026; border-radius: 16px; padding: 34px\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"s-name\" style=\"font-weight: 600; font-size: 15px\">Имя или ник<\u002Flabel>\n          <input id=\"s-name\" type=\"text\" placeholder=\"Как к тебе обращаться\" style=\"background: #0B0D10; border: 1px solid #2E333C; border-radius: 10px; padding: 13px 16px; color: #F1F3F5; font-size: 16px; font-family: 'Golos Text', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"s-tg\" style=\"font-weight: 600; font-size: 15px\">Telegram<\u002Flabel>\n          <input id=\"s-tg\" type=\"text\" placeholder=\"@username\" style=\"background: #0B0D10; border: 1px solid #2E333C; border-radius: 10px; padding: 13px 16px; color: #F1F3F5; font-size: 16px; font-family: 'Golos Text', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"s-exp\" style=\"font-weight: 600; font-size: 15px\">Опыт<\u002Flabel>\n          <sc-raw-select id=\"s-exp\" style=\"background: #0B0D10; border: 1px solid #2E333C; border-radius: 10px; padding: 13px 16px; color: #F1F3F5; font-size: 16px; font-family: 'Golos Text', sans-serif\">\n            <option>Без опыта<\u002Foption>\n            <option>Веду Fansly / OnlyFans сама<\u002Foption>\n            <option>Вебкам<\u002Foption>\n            <option>Другое<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"s-page\" style=\"font-weight: 600; font-size: 15px\">Ссылка на страницу или соцсети <span style=\"color: #5F6672; font-weight: 400\">(если есть)<\u002Fspan><\u002Flabel>\n          <input id=\"s-page\" type=\"text\" placeholder=\"Для бесплатного разбора\" style=\"background: #0B0D10; border: 1px solid #2E333C; border-radius: 10px; padding: 13px 16px; color: #F1F3F5; font-size: 16px; font-family: 'Golos Text', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; align-items: flex-start\">\n          <input id=\"s-age\" type=\"checkbox\" style=\"width: 18px; height: 18px; margin-top: 3px\">\n          <label for=\"s-age\" style=\"font-size: 15px; color: #9AA1AC\">Мне есть 18 лет<\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; align-items: flex-start\">\n          <input id=\"s-gdpr\" type=\"checkbox\" style=\"width: 18px; height: 18px; margin-top: 3px\">\n          <label for=\"s-gdpr\" style=\"font-size: 15px; color: #9AA1AC\">Согласна на обработку данных для связи (<a href=\"#privacy\">политика<\u002Fa>)<\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"button\" style=\"background: {{accent}}; color: #0B0D10; font-weight: 700; font-size: 17px; padding: 17px; border: none; border-radius: 999px; font-family: 'Golos Text', sans-serif; cursor: pointer; margin-top: 4px\">Отправить заявку →<\u002Fbutton>\n        <div style=\"font-size: 13px; color: #5F6672\">Заявка ни к чему не обязывает. Данные не передаём никому.<\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer id=\"privacy\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 30px 24px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; font-size: 14px; color: #5F6672\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" aria-hidden=\"true\">\n          <path d=\"M6 10 H26\" stroke=\"#5F6672\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M11 16 H26\" stroke=\"#5F6672\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"M6 22 H21\" stroke=\"#5F6672\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n        <span>© 2026 Storm Agency<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <span>Только 18+<\u002Fspan>\n        <a href=\"#privacy\">Политика приватности<\u002Fa>\n        <a href=\"https://t.me/ВАШ_TELEGRAM\">Telegram<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D7F75B&quot;,&quot;options&quot;:[&quot;#D7F75B&quot;,&quot;#6A95FF&quot;,&quot;#4FD8EB&quot;,&quot;#FF8A5B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#D7F75B' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
