<body>
  <div id="__bundler_placeholder">Loading Tempest Agency — менеджмент для Fansly-криейторов...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ref=\"#safety\" style=\"text-decoration: none; color: #BDB9C9\">Безопасность<\u002Fa>\n        <a href=\"#faq\" style=\"text-decoration: none; color: #BDB9C9\">FAQ<\u002Fa>\n        <a href=\"#apply\" style=\"text-decoration: none; background: {{accent}}; color: #14121A; font-weight: 700; padding: 10px 20px; border-radius: 8px\">Оставить заявку<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 96px 24px 88px 24px; display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}\">TEMPEST AGENCY · FANSLY MANAGEMENT<\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 56px; line-height: 1.12; max-width: 840px\">Ты снимаешь.<br>Мы делаем остальное.<\u002Fh1>\n      <p style=\"margin: 0; max-width: 640px; font-size: 20px; color: #BDB9C9\">Менеджмент-агентство для криейторов на Fansly. Трафик, переписки, продажи, цены и защита контента — на нашей команде. За тобой — только съёмка и контроль своего аккаунта.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px\">\n        <a href=\"#apply\" style=\"text-decoration: none; background: {{accent}}; color: #14121A; font-weight: 700; font-size: 17px; padding: 16px 32px; border-radius: 10px\">Оставить заявку<\u002Fa>\n        <a href=\"https://t.me/ВАШ_TELEGRAM\" style=\"text-decoration: none; border: 1px solid #3A3648; color: #F4F2ED; font-weight: 600; font-size: 17px; padding: 16px 32px; border-radius: 10px\">Написать в Telegram<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 28px; margin-top: 24px; font-size: 15px; color: #8E8A9C\">\n        <span>Работаем по договору<\u002Fspan>\n        <span>Только 18+<\u002Fspan>\n        <span>RU · UA · EN<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SPLIT: мы / ты -->\n  <section style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n      <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Кто что делает<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <div style=\"flex: 1 1 420px; background: #181622; border: 1px solid #262330; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: {{accent}}\">МЫ БЕРЁМ НА СЕБЯ<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#8B7CFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Трафик и продвижение: Reddit, X/Twitter, взаимопиар — стабильный приток новых фанатов<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#8B7CFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Переписки и продажи: команда ведёт чаты на английском 24/7, ты не переписываешься вообще<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#8B7CFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Контент-стратегия: готовые сценарии и шот-листы — ты всегда знаешь, что снимать<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#8B7CFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Цены, аналитика и рост: тесты, статистика, работа с постоянными фанатами<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#8B7CFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Защита: geo-блокировка, мониторинг сливов и удаление по DMCA<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 420px; background: #141219; border: 1px solid #262330; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #8E8A9C\">ОСТАЁТСЯ ТЕБЕ<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#6E6A7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Съёмка по готовым шот-листам — 1–2 съёмочных дня в неделю<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#6E6A7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Полный контроль аккаунта: он твой, выплаты приходят тебе<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 4px\"><path d=\"m5 12 5 5L19 8\" stroke=\"#6E6A7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span>Последнее слово по границам: что снимать и что не снимать, решаешь только ты<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- КАК РАБОТАЕМ -->\n  <section id=\"how\" style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n      <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Как это работает<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <div style=\"flex: 1 1 230px; display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px\">\n          <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; color: {{accent}}\">01<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Заявка<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Короткая анкета ниже — 2 минуты. Без документов и фото на этом этапе.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 230px; display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px\">\n          <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; color: {{accent}}\">02<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Созвон<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">15–20 минут: знакомимся, отвечаем на вопросы, честно говорим, подойдём ли друг другу.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 230px; display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px\">\n          <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; color: {{accent}}\">03<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Онбординг<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Договор, верификация 18+, образ и персона, первая съёмка по нашим шот-листам.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 230px; display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px\">\n          <div style=\"font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; color: {{accent}}\">04<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px\">Запуск и рост<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Включаем трафик и чаты. Первые выплаты — по мере первых продаж, обычно в первый же месяц.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- БЕЗОПАСНОСТЬ -->\n  <section id=\"safety\" style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}\">ГЛАВНЫЙ РАЗДЕЛ ЭТОЙ СТРАНИЦЫ<\u002Fdiv>\n      <h2 style=\"margin: 0 0 24px 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Безопасность и честные правила<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Geo-блокировка<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Закрываем показ твоей страницы в твоей стране и соседних — знакомые её не увидят.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Аккаунт — твой<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Мы не забираем права на аккаунт и не меняем твои данные. Выплаты от Fansly приходят напрямую тебе.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Прозрачные расчёты<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Фиксированный процент по договору, еженедельные отчёты со статистикой. Никаких скрытых удержаний и штрафов.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Защита от сливов<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Вотермарки, еженедельный мониторинг и удаление украденного контента по DMCA.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Твои границы — закон<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Перед стартом фиксируем письменно, что ты готова снимать, а что нет. Команда никогда не выходит за эти рамки.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 330px; padding: 28px; background: #181622; border: 1px solid #262330; border-radius: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-weight: 700; font-size: 18px\">Выход без ловушек<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 15px\">Расторжение по условиям договора — аккаунт и аудитория остаются с тобой.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ПОЧЕМУ FANSLY -->\n  <section style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}\">ПОЧЕМУ ИМЕННО FANSLY<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Платформа, где новичку проще вырасти<\u002Fh2>\n        <p style=\"margin: 0; color: #BDB9C9\">Мы сознательно специализируемся на Fansly, а не распыляемся по всем платформам: здесь механика роста работает в пользу новых криейторов.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 480px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; gap: 16px; padding: 20px 24px; background: #181622; border: 1px solid #262330; border-radius: 12px\"><span style=\"font-family: 'Unbounded', sans-serif; color: {{accent}}; font-weight: 700\">→<\u002Fspan><span>Встроенные рекомендации и поиск: платформа сама показывает твою страницу новым фанатам<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 16px; padding: 20px 24px; background: #181622; border: 1px solid #262330; border-radius: 12px\"><span style=\"font-family: 'Unbounded', sans-serif; color: {{accent}}; font-weight: 700\">→<\u002Fspan><span>Меньше конкуренции, чем на OnlyFans — новой странице легче быть замеченной<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 16px; padding: 20px 24px; background: #181622; border: 1px solid #262330; border-radius: 12px\"><span style=\"font-family: 'Unbounded', sans-serif; color: {{accent}}; font-weight: 700\">→<\u002Fspan><span>Гибкие уровни подписки: бесплатный вход для массы + платные тиры для постоянных<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; gap: 16px; padding: 20px 24px; background: #181622; border: 1px solid #262330; border-radius: 12px\"><span style=\"font-family: 'Unbounded', sans-serif; color: {{accent}}; font-weight: 700\">→<\u002Fspan><span>Лояльность к нишам: больше свободы для тематического контента, чем на других платформах<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"border-bottom: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 36px\">\n      <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Частые вопросы<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 860px\">\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Нужен ли опыт?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">Нет. Большинство наших заявок — девушки без опыта. Персону, стратегию и сценарии мы строим вместе с нуля. Опыт в OnlyFans или вебкаме — плюс, но не требование.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Обязательно ли показывать лицо?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">Нет, можно работать анонимно. Честно скажем: с лицом страница растёт быстрее, но формат «без лица» мы тоже умеем продвигать — обсудим на созвоне.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Сколько времени это занимает?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">1–2 съёмочных дня в неделю по готовым шот-листам плюс короткая связь с менеджером. Переписки, постинг и продвижение — полностью на нас.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Когда первые деньги?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">Честный ответ: первые продажи обычно идут в первый месяц, но заметный стабильный доход — это 2–3 месяца раскачки страницы. Мы не обещаем «$5000 с первой недели» — так не бывает ни у кого.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Что с переписками — я должна общаться с фанатами?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">Нет. Чаты ведёт обученная команда на английском по твоим правилам и границам. Ты можешь включаться, если захочешь, но это не обязанность.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 28px; background: #181622; border: 1px solid #262330; border-radius: 12px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-weight: 700\">Какой процент берёт агентство?<\u002Fdiv>\n          <div style=\"color: #BDB9C9; font-size: 16px\">Процент фиксируется в договоре до старта и зависит от формата работы. Все условия озвучиваем прямо на первом созвоне — без «обсудим потом».<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ФОРМА -->\n  <section id=\"apply\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px 96px 24px; display: flex; flex-wrap: wrap; gap: 48px\">\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}\">ЗАЯВКА<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 34px\">Начнём с короткой анкеты<\u002Fh2>\n        <p style=\"margin: 0; color: #BDB9C9\">2 минуты. Никаких документов и фото на этом этапе. Ответим в Telegram в течение 24 часов.<\u002Fp>\n        <p style=\"margin: 0; color: #8E8A9C; font-size: 15px\">Быстрее? Напиши нам напрямую: <a href=\"https://t.me/ВАШ_TELEGRAM\">@ВАШ_TELEGRAM<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <form style=\"flex: 1 1 480px; display: flex; flex-direction: column; gap: 18px; background: #181622; border: 1px solid #262330; border-radius: 16px; padding: 36px\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-name\" style=\"font-weight: 600; font-size: 15px\">Имя или ник<\u002Flabel>\n          <input id=\"f-name\" type=\"text\" placeholder=\"Как к тебе обращаться\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-country\" style=\"font-weight: 600; font-size: 15px\">Страна<\u002Flabel>\n          <input id=\"f-country\" type=\"text\" placeholder=\"Где ты сейчас живёшь\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-exp\" style=\"font-weight: 600; font-size: 15px\">Опыт<\u002Flabel>\n          <sc-raw-select id=\"f-exp\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n            <option>Без опыта<\u002Foption>\n            <option>Есть OnlyFans / Fansly<\u002Foption>\n            <option>Вебкам<\u002Foption>\n            <option>Другое<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-hours\" style=\"font-weight: 600; font-size: 15px\">Сколько часов в неделю готова уделять<\u002Flabel>\n          <sc-raw-select id=\"f-hours\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n            <option>До 5 часов<\u002Foption>\n            <option>5–10 часов<\u002Foption>\n            <option>10–20 часов<\u002Foption>\n            <option>Больше 20 часов<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-links\" style=\"font-weight: 600; font-size: 15px\">Ссылки на соцсети <span style=\"color: #6E6A7C; font-weight: 400\">(необязательно)<\u002Fspan><\u002Flabel>\n          <input id=\"f-links\" type=\"text\" placeholder=\"Instagram, X, Fansly — что есть\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"f-tg\" style=\"font-weight: 600; font-size: 15px\">Telegram для связи<\u002Flabel>\n          <input id=\"f-tg\" type=\"text\" placeholder=\"@username\" style=\"background: #100F15; border: 1px solid #2E2A3A; border-radius: 8px; padding: 13px 16px; color: #F4F2ED; font-size: 16px; font-family: 'Manrope', sans-serif\">\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; align-items: flex-start\">\n          <input id=\"f-age\" type=\"checkbox\" style=\"width: 18px; height: 18px; margin-top: 3px\">\n          <label for=\"f-age\" style=\"font-size: 15px; color: #BDB9C9\">Мне есть 18 лет<\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; align-items: flex-start\">\n          <input id=\"f-gdpr\" type=\"checkbox\" style=\"width: 18px; height: 18px; margin-top: 3px\">\n          <label for=\"f-gdpr\" style=\"font-size: 15px; color: #BDB9C9\">Согласна на обработку данных для связи со мной (<a href=\"#privacy\">политика приватности<\u002Fa>)<\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"button\" style=\"background: {{accent}}; color: #14121A; font-weight: 700; font-size: 17px; padding: 16px; border: none; border-radius: 10px; font-family: 'Manrope', sans-serif; cursor: pointer; margin-top: 6px\">Отправить заявку<\u002Fbutton>\n        <div style=\"font-size: 13px; color: #6E6A7C\">Заявка ни к чему не обязывает. Данные видим только мы, никому не передаём.<\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer id=\"privacy\" style=\"border-top: 1px solid #221F2C\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; font-size: 14px; color: #8E8A9C\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <span style=\"display: inline-flex; width: 26px; height: 26px; border-radius: 6px; background: #262330; align-items: center; justify-content: center\">\n          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z\" stroke=\"#8E8A9C\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span>© 2026 Tempest Agency<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <span>Только для лиц 18+<\u002Fspan>\n        <a href=\"#privacy\">Политика приватности<\u002Fa>\n        <a href=\"https://t.me/ВАШ_TELEGRAM\">Telegram<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8B7CFF&quot;,&quot;options&quot;:[&quot;#8B7CFF&quot;,&quot;#5EE6C8&quot;,&quot;#F2B8C6&quot;,&quot;#E8C547&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:5300}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#8B7CFF' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
